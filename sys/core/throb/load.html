<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>piosk Boot</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #004d00; /* dark green */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Arial', sans-serif;
    overflow: hidden;
  }

  .boot-text {
    font-size: 6rem;
    font-weight: bold;
    color: #00ff00;
    position: relative;
    display: flex;
    gap: 1rem;
  }

  .boot-text span {
    position: relative;
    display: inline-block;
    color: #00ff00;
    /* base text shadow for depth */
    text-shadow: 2px 2px 0 #003300, 4px 4px 0 #006600, 6px 6px 0 #009900;
    overflow: hidden;
  }

  /* left-to-right swipe overlay */
  .boot-text span::before {
    content: attr(data-char);
    position: absolute;
    top: 0; left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(120deg, rgba(255,255,255,0.0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0.0) 100%);
    color: #00ff00;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: swipe 1.5s infinite linear;
  }

  @keyframes swipe {
    0% { left: -100%; }
    100% { left: 100%; }
  }

  .footer {
    position: absolute;
    bottom: 20px;
    font-size: 0.9rem;
    color: #00bb00;
    font-weight: bold;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<div class="boot-text">
  <span data-char="π">π</span>
  <span data-char="π">π</span>
  <span data-char="π">π</span>
</div>

<div class="footer">wicorn29</div>

</body>
</html>
