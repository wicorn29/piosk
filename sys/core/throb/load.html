<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>piosk Boot</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #004d00; /* dark green */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Arial', sans-serif;
    overflow: hidden;
  }

  /* Container for the three π symbols */
  .pi-container {
    display: flex;
    gap: 2rem;
    font-size: 6rem;
    color: #00ff00;
  }

  .pi {
    display: inline-block;
    animation: bounce 2s infinite; /* base animation */
  }

  /* staggered timing for sequence */
  .pi:nth-child(1) { animation-delay: 0s; }
  .pi:nth-child(2) { animation-delay: 0.7s; }
  .pi:nth-child(3) { animation-delay: 1.4s; }

  @keyframes bounce {
    0%, 30%, 100% { transform: translateY(0); }
    15% { transform: translateY(-40px); } /* move up */
  }

  .footer {
    position: absolute;
    bottom: 20px;
    font-size: 0.9rem;
    color: #00bb00;
    font-weight: bold;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<div class="pi-container">
  <span class="pi">π</span>
  <span class="pi">π</span>
  <span class="pi">π</span>
</div>

<div class="footer">wicorn29</div>

</body>
</html>
